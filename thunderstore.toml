[config]
schemaVersion = "0.0.1"

[package]
namespace = "SpecialCircumstances"
name = "ForgeSmartToggle"
versionNumber = "0.1.0"
description = "Adds a third Hybrid state to the forge toggle that skips Morsels, Imps and Whelps"
websiteUrl = "https://thunderstore.io"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
MT2-Trainworks_Reloaded = "0.7.2"
Conductor-Conductor = "0.4.1"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./"

[[build.copy]]
source = "./plugin_build"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = [ "monster-train-2" ]
